spring:
  application:
    name: order-service

  datasource:
    url: jdbc:mysql://localhost:3306/orders_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
    username: root
    password: Sharankumar@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
